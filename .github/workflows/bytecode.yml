name: Extract Bytecode

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bytecode:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract JAR
        run: |
          mkdir -p work
          unzip -o original/prehistoric-tribes-0.1.38.jar -d work

      - name: Create bytecode reports
        run: |
          mkdir -p analysis/bytecode

          for file in work/*.class; do
            name=$(basename "$file" .class)

            javap -classpath work -c -p -verbose "$name" \
              > "analysis/bytecode/${name}.txt"
          done

      - name: Create field map
        run: |
          python3 tools/field_map.py

      - name: Create method map
        run: |
          python3 tools/method_map.py

      - name: Commit analysis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add analysis/bytecode
          git add analysis/field_map.txt
          git add analysis/method_map.txt

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update bytecode analysis"
          fi

          git pull --rebase origin main

          git push
