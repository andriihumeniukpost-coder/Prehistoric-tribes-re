
name: Bytecode Analysis

on:
  workflow_dispatch:
  push:
    paths:
      - "original/**"
      - "tools/**"
      - ".github/workflows/bytecode.yml"

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Find original JAR
        id: jar
        shell: bash
        run: |
          set -euo pipefail

          JAR="original/prehistoric-tribes-0.1.38.jar"

          if [ ! -f "$JAR" ]; then
            echo "ERROR: JAR not found: $JAR"
            echo "Available JAR files:"
            find original -type f -name '*.jar' -print || true
            exit 1
          fi

          echo "path=$JAR" >> "$GITHUB_OUTPUT"

      - name: Extract original JAR
        run: |
          set -euo pipefail

          rm -rf work
          mkdir -p work
          cd work
          jar xf "../${{ steps.jar.outputs.path }}"

      - name: Generate bytecode reports
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p analysis/bytecode

          find work -type f -name '*.class' | sort | while read -r class_file; do
            relative="${class_file#work/}"
            class_name="${relative%.class}"
            class_name="${class_name//\//.}"
            output="analysis/bytecode/${class_name//./_}.txt"

            echo "Analyzing $class_name"

            javap \
              -classpath work \
              -p \
              -c \
              -s \
              -constants \
              "$class_name" > "$output"
          done

          if [ ! -f analysis/bytecode/c.txt ]; then
            echo "ERROR: analysis/bytecode/c.txt was not generated."
            echo "Generated reports:"
            find analysis/bytecode -maxdepth 1 -type f -print
            exit 1
          fi

      - name: Run JAR analyzer
        run: |
          set -euo pipefail
          python tools/analyze_jar.py

      - name: Run field map
        run: python tools/field_map.py

      - name: Run method map
        run: python tools/method_map.py

      - name: Run hot fields analysis
        run: python tools/hot_fields.py

      - name: Run field usage analysis
        run: python tools/field_usage.py

      - name: Run field trace
        run: python tools/field_trace.py

      - name: Run index trace
        run: python tools/index_trace.py

      - name: Run record map
        run: python tools/record_map.py

      - name: Run record structure analysis
        run: python tools/record_structure.py

      - name: Run record fields analysis
        run: python tools/record_fields.py

      - name: Run record clusters analysis
        run: python tools/record_clusters.py

      - name: Run array access analysis
        run: python tools/array_access.py

      - name: Run write context analysis
        run: python tools/write_context.py

      - name: Run paired regions analysis
        run: python tools/paired_regions.py

      - name: Run field semantics analysis
        run: python tools/field_semantics.py

      - name: Commit analysis reports
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            analysis/bytecode \
            analysis/jar_report.txt \
            analysis/field_map.txt \
            analysis/method_map.txt \
            analysis/hot_fields.txt \
            analysis/field_usage.txt \
            analysis/field_trace.txt \
            analysis/index_trace.txt \
            analysis/record_map.txt \
            analysis/record_structure.txt \
            analysis/record_fields.txt \
            analysis/record_clusters.txt \
            analysis/array_access.txt \
            analysis/write_context.txt \
            analysis/paired_regions.txt \
            analysis/field_semantics.txt

          if git diff --cached --quiet; then
            echo "No analysis changes to commit."
            exit 0
          fi

          git commit -m "Update bytecode analysis reports"

          git pull --rebase origin "${GITHUB_REF_NAME:-main}"
          git push origin "HEAD:${GITHUB_REF_NAME:-main}"
