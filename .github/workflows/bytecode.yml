
name: Bytecode Analysis

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "original/**"
      - "tools/**"
      - ".github/workflows/bytecode.yml"

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Prepare directories
        run: |
          mkdir -p work
          mkdir -p analysis/bytecode

      - name: Extract original JAR
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path

          jars = sorted(Path("original").glob("*.jar"))
          if not jars:
              raise SystemExit("ERROR: No JAR found in original/")

          jar = jars[0]
          print(f"Extracting: {jar}")

          with zipfile.ZipFile(jar) as archive:
              archive.extractall("work")
          PY

      - name: Generate bytecode reports
        run: |
          set -e
          find work -name '*.class' -print0 | while IFS= read -r -d '' file; do
            relative="${file#work/}"
            output="analysis/bytecode/${relative%.class}.txt"
            mkdir -p "$(dirname "$output")"
            javap -classpath work -p -c -s -constants "${relative%.class}" > "$output"
          done

      - name: Analyze JAR
        run: |
          if [ -f tools/analyze_jar.py ]; then
            python tools/analyze_jar.py
          else
            echo "Skipping: tools/analyze_jar.py not found"
          fi

      - name: Generate field map
        run: |
          if [ -f tools/field_map.py ]; then
            python tools/field_map.py
          fi

      - name: Generate method map
        run: |
          if [ -f tools/method_map.py ]; then
            python tools/method_map.py
          fi

      - name: Analyze hot fields
        run: |
          if [ -f tools/hot_fields.py ]; then
            python tools/hot_fields.py
          fi

      - name: Analyze field usage
        run: |
          if [ -f tools/field_usage.py ]; then
            python tools/field_usage.py
          fi

      - name: Trace field references
        run: |
          if [ -f tools/field_trace.py ]; then
            python tools/field_trace.py
          fi

      - name: Trace index patterns
        run: |
          if [ -f tools/index_trace.py ]; then
            python tools/index_trace.py
          fi

      - name: Analyze record map
        run: |
          if [ -f tools/record_map.py ]; then
            python tools/record_map.py
          fi

      - name: Analyze record structure
        run: |
          if [ -f tools/record_structure.py ]; then
            python tools/record_structure.py
          fi

      - name: Analyze record fields
        run: |
          if [ -f tools/record_fields.py ]; then
            python tools/record_fields.py
          fi

      - name: Analyze record clusters
        run: |
          if [ -f tools/record_clusters.py ]; then
            python tools/record_clusters.py
          fi

      - name: Analyze array access
        run: |
          if [ -f tools/array_access.py ]; then
            python tools/array_access.py
          fi

      - name: Analyze write context
        run: |
          if [ -f tools/write_context.py ]; then
            python tools/write_context.py
          fi

      - name: Analyze paired regions
        run: |
          if [ -f tools/paired_regions.py ]; then
            python tools/paired_regions.py
          fi

      - name: Analyze field semantics
        run: |
          if [ -f tools/field_semantics.py ]; then
            python tools/field_semantics.py
          fi

      - name: Trace array field accesses
        run: |
          python tools/array_field_trace.py

      - name: Commit analysis results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add analysis/

          if git diff --cached --quiet; then
            echo "No analysis changes to commit."
            exit 0
          fi

          git commit -m "Update bytecode analysis"
          git pull --rebase origin main
          git push origin HEAD:main

