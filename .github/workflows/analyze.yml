
name: Analyze JAR

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run JAR analysis
        run: python3 tools/analyze_jar.py

      - name: Dump game bytecode
        run: python3 tools/dump_game_bytecode.py

      - name: Dump /pd0 graphics tables
        run: python3 tools/dump_pd0.py

      - name: Commit analysis reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add analysis/jar_report.txt
          git add analysis/bytecode/g.txt
          git add analysis/pd0_graphics.txt
          git add analysis/pd0_tables/

          git diff --cached --quiet || git commit -m "Dump game bytecode and pd0 graphics tables"

          git push
