name: Analyze JAR

on:
  workflow_dispatch:
  
permissions:
  contents: write
  
jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run JAR analysis
        run: python3 tools/analyze_jar.py

      - name: Commit analysis report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/jar_report.txt
          git diff --cached --quiet || git commit -m "Add JAR analysis report"
          git push
